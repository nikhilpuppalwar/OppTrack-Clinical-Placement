<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OppTrack AI Autofill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- ── Login View ─────────────────────────────────────────────────── -->
  <div id="login-view" class="view hidden">
    <div class="logo-row">
      <div class="logo-dot"></div>
      <span class="logo-text">OppTrack</span>
    </div>
    <h2 class="view-title">Sign in to autofill</h2>
    <p class="view-sub">Connect your OppTrack account to enable intelligent AI form autofilling.</p>

    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>
    <div class="field-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="login-error" class="error-msg hidden"></div>
    <button id="login-btn" class="btn-primary">Sign In</button>
  </div>

  <!-- ── Main View ──────────────────────────────────────────────────── -->
  <div id="main-view" class="view hidden">
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-dot"></div>
        <span class="logo-text">OppTrack AI</span>
      </div>
      <div class="header-right">
        <span id="user-name" class="user-chip"></span>
        <button id="settings-toggle-btn" class="btn-icon" title="AI Settings">⚙️</button>
        <button id="logout-btn" class="btn-icon" title="Sign out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Opportunity Banner -->
    <div id="opp-banner" class="opp-banner hidden">
      <div class="opp-banner-content">
        <div class="opp-icon">🎯</div>
        <div class="opp-info">
          <div id="opp-title" class="opp-title"></div>
          <div id="opp-sub" class="opp-sub">Detected from form URL</div>
        </div>
      </div>
      <div class="opp-banner-actions">
        <label class="toggle-row">
          <span>Auto-mark as Applied after submit?</span>
          <div class="toggle-wrap">
            <input type="checkbox" id="auto-apply-toggle" />
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>
    </div>

    <!-- Settings Card (Collapsible) -->
    <div id="settings-card" class="settings-card hidden">
      <div class="settings-title">🤖 AI Key & Vector Settings</div>
      <div class="field-group">
        <label for="llm-provider">LLM Provider</label>
        <select id="llm-provider">
          <option value="groq">Groq (Llama 3.3 70B - Recommended)</option>
          <option value="openai">OpenAI (GPT-4o Mini)</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </div>
      <div class="field-group">
        <label for="llm-api-key">API Key</label>
        <input type="password" id="llm-api-key" placeholder="Enter gsk_ or sk- key..." />
      </div>
      <div class="field-group">
        <label for="llm-model">Model Name (Optional)</label>
        <input type="text" id="llm-model" placeholder="e.g. llama-3.3-70b-versatile" />
      </div>
      <div id="settings-msg" class="settings-msg hidden"></div>
      <button id="save-settings-btn" class="btn-secondary" style="width:100%;margin-top:6px;">Save & Sync Settings</button>
    </div>

    <!-- Status row -->
    <div id="form-status" class="form-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking page...</span>
    </div>

    <!-- Action Buttons -->
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button id="autofill-btn" class="btn-primary" style="flex:1;" disabled>
        ✨ AI Vector Autofill
      </button>
      <button id="analyze-btn" class="btn-secondary" style="flex:1;" disabled>
        🔍 Save New Data
      </button>
    </div>

    <!-- Recent Forms -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">Recent Forms</span>
      </div>
      <div id="recent-forms-list" class="recent-list">
        <div class="recent-empty">No recent form activity</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
